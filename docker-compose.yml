version: '3.8'
services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: liser_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    container_name: liser_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - liser_net
  backend:
    build: ./backend
    container_name: liser_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - mongodb
    networks:
      - liser_net
  frontend:
    build: ./frontend
    container_name: liser_frontend
    restart: unless-stopped
    networks:
      - liser_net
  nginx:
    image: nginx:alpine
    container_name: liser_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - liser_net
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
volumes:
  mongo_data:
  certbot_www:
  certbot_certs:
networks:
  liser_net: