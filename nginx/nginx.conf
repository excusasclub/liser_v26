events {}
http {
    client_max_body_size 20M;

    map $http_user_agent $is_crawler {
        default 0;
        "~*googlebot" 1;
        "~*bingbot" 1;
        "~*slurp" 1;
        "~*duckduckbot" 1;
        "~*baiduspider" 1;
        "~*yandexbot" 1;
        "~*facebot" 1;
        "~*twitterbot" 1;
        "~*linkedinbot" 1;
        "~*whatsapp" 1;
        "~*telegrambot" 1;
        "~*applebot" 1;
        "~*GPTBot" 1;
        "~*ChatGPT-User" 1;
        "~*PerplexityBot" 1;
        "~*ClaudeBot" 1;
    }

    server {
        listen 80;
        server_name liser.es app.liser.es;

        location /sitemap.xml {
            proxy_pass http://backend:8001/sitemap.xml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/([^/]+)/([^/]+)$ {
            set $prerender 0;
            if ($is_crawler) {
                set $prerender 1;
            }
            if ($prerender = 1) {
                rewrite ^/(.*)$ /render/$1 break;
                proxy_pass http://backend:8001;
            }
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name api.liser.es;
        location / {
            proxy_pass http://backend:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }
    }
}